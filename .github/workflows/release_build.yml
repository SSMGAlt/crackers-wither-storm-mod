name: Release Build

on:
  push:
    branches:
      - 1.20.1-src
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  release:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon -Dorg.gradle.jvmargs="-Xss8m"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: witherstormmod-release-${{ github.ref_name }}-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 90
